<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/assets/icon-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Nyumil Dimsum</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <div id="app">
    <header class="bar-atas" id="bar-atas" hidden>
      <span class="bar-atas__judul">Nyumil Dimsum</span>
      <button class="bar-atas__profil" id="btn-profil" aria-label="Keluar">👤</button>
    </header>

    <main id="isi-tab" class="isi-tab"></main>

    <nav class="tab-bar" id="tab-bar" hidden>
      <button class="tab-bar__item" data-tab="home" aria-current="page">
        <span class="tab-bar__ikon">🏠</span><span class="tab-bar__label">Home</span>
      </button>
      <button class="tab-bar__item" data-tab="sales">
        <span class="tab-bar__ikon">🧾</span><span class="tab-bar__label">Sales</span>
      </button>
      <button class="tab-bar__item" data-tab="order">
        <span class="tab-bar__ikon">📅</span><span class="tab-bar__label">Order</span>
      </button>
      <button class="tab-bar__item" data-tab="inventory">
        <span class="tab-bar__ikon">❄️</span><span class="tab-bar__label">Inventory</span>
      </button>
      <button class="tab-bar__item" data-tab="finance">
        <span class="tab-bar__ikon">📊</span><span class="tab-bar__label">Finance</span>
      </button>
    </nav>
  </div>

  <script src="/js/vendor/supabase-js.umd.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
